<div class="comparator" id="comparator" data-mode="blink" aria-labelledby="cmp-title">
        <div class="cmp-head">
          <div><span class="cmp-eyebrow">Try it</span><h3 class="cmp-title" id="cmp-title">Find the point of light that moved.</h3></div>
          <div class="cmp-progress"><span class="cmp-round" id="cmp-round">Field 1 of 3</span><span class="cmp-dots" aria-hidden="true"><i class="cmp-dot"></i><i class="cmp-dot"></i><i class="cmp-dot"></i></span></div>
        </div>
        <div class="cmp-plate" id="cmp-plate" tabindex="0" role="group" aria-label="Two looks at the same patch of sky. Compare them, then click the point of light you think moved.">
          <canvas class="cmp-canvas cmp-a" aria-hidden="true"></canvas>
          <canvas class="cmp-canvas cmp-b" aria-hidden="true"></canvas>
          <span class="cmp-badge cmp-badge-a" aria-hidden="true">First look</span>
          <span class="cmp-badge cmp-badge-b" aria-hidden="true">Second look</span>
          <div class="cmp-handle" aria-hidden="true"><span class="cmp-knob"></span></div>
          <div class="cmp-marks" aria-hidden="true"></div>
        </div>
        <div class="cmp-controls">
          <div class="cmp-mode" role="group" aria-label="How to compare the two looks">
            <button type="button" class="cmp-btn" data-mode="blink" aria-pressed="true">Blink</button>
            <button type="button" class="cmp-btn" data-mode="slide" aria-pressed="false">Slide</button>
          </div>
          <div class="cmp-blink-only">
            <button type="button" class="cmp-btn" id="cmp-pause" aria-pressed="false">Pause</button>
            <button type="button" class="cmp-btn" id="cmp-switch">Switch look</button>
          </div>
          <label class="cmp-slide-only cmp-range"><span class="sr-only">Wipe between the first and second look</span><input type="range" id="cmp-range" min="0" max="100" value="50"></label>
          <button type="button" class="cmp-btn" id="cmp-hint">Show me</button>
          <button type="button" class="cmp-btn is-primary" id="cmp-next" hidden>Next field</button>
        </div>
        <p class="cmp-status" id="cmp-status" role="status" aria-live="polite">The sky blinks between two looks. One point of light moved. Click it.</p>
        <p class="cmp-note">An illustration of the technique on a made-up patch of sky. It is not real SPHEREx data.</p>
      </div>
